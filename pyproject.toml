[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "notegrabber"
version = "0.1.0"
description = "Small baseline CLI for deterministic WAV-to-MIDI transcription fixtures"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
cqt = [
    "librosa>=0.10",
]
basic-pitch = [
    "basic-pitch[onnx]>=0.4",
]
ml = [
    "librosa>=0.10",
    "basic-pitch[onnx]>=0.4",
]
gui = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]
standalone = [
    "librosa>=0.10",
    "basic-pitch[onnx]>=0.4",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]

[project.scripts]
notegrabber = "notegrabber.cli:main"
notegrabber-gui = "notegrabber.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notegrabber"]
