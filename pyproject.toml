[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "notegrabber"
version = "0.1.0"
description = "ToneTrace: audio-to-MIDI transcription and stem separation with a CLI and a native GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Harpo MAxx" }]
keywords = ["midi", "transcription", "audio", "basic-pitch", "music", "gui"]
dependencies = []

[project.urls]
Homepage = "https://github.com/harpomaxx/tonetrace"
Repository = "https://github.com/harpomaxx/tonetrace"
Issues = "https://github.com/harpomaxx/tonetrace/issues"

[project.optional-dependencies]
cqt = [
    "librosa>=0.10",
    "numpy>=1.23",
    "soundfile>=0.12",
]
basic-pitch = [
    "basic-pitch[onnx]>=0.4",
]
ml = [
    "librosa>=0.10",
    "numpy>=1.23",
    "soundfile>=0.12",
    "basic-pitch[onnx]>=0.4",
]
# Stem separation via HT-Demucs ONNX (pure numpy + onnxruntime, no PyTorch).
# Auto-downloads the ~166 MB fp16 model on first use. Kept out of [gui] so the
# desktop install stays lighter; opt in explicitly when you want stem splitting.
separate = [
    "demucs-onnx>=0.3",
]
# The GUI decodes MP3/FLAC/OGG, builds the pitch overview, and analyzes audio,
# so it needs the audio/ML stack -- not just PySide6. Installing `.[gui]` must
# give a GUI that can actually open a file and analyze it out of the box.
gui = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "librosa>=0.10",
    "numpy>=1.23",
    "soundfile>=0.12",
    "basic-pitch[onnx]>=0.4",
]
standalone = [
    "librosa>=0.10",
    "numpy>=1.23",
    "soundfile>=0.12",
    "basic-pitch[onnx]>=0.4",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]

[project.scripts]
notegrabber = "notegrabber.cli:main"
notegrabber-gui = "notegrabber.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notegrabber"]
# Ensure the bundled GUI icon SVGs (loaded at runtime via Path(__file__)) ship in
# the wheel, so a non-editable install from any directory has working buttons.
artifacts = ["src/notegrabber/gui/resources/**/*.svg"]

[tool.hatch.build.targets.sdist]
include = [
    "src/notegrabber/**",
    "README.md",
    "LICENSE",
    "AGENTS.md",
    "FEATURES.md",
]
