[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "notegrabber"
version = "0.1.0"
description = "Small baseline CLI for deterministic WAV-to-MIDI transcription fixtures"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cqt = [
    "librosa>=0.10",
]
basic-pitch = [
    "basic-pitch[onnx]>=0.4",
]
ml = [
    "librosa>=0.10",
    "basic-pitch[onnx]>=0.4",
]

[project.scripts]
notegrabber = "notegrabber.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notegrabber"]
